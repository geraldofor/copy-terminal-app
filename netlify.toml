# Configuração de build para Netlify
# O app é uma SPA (Vite) — o backend/database vive na Convex Cloud,
# então o Netlify apenas serve os arquivos estáticos de dist/.

[build]
  # Se CONVEX_DEPLOY_KEY estiver configurado (ver instruções do Convex),
  # deploya as funções do backend para o deployment de produção e depois
  # builda o frontend apontando para ele. Sem a chave, faz só o build
  # normal (os botões PayPal continuam funcionando via VITE_PAYPAL_CLIENT_ID).
  command = "bash -c 'if [ -n \"$CONVEX_DEPLOY_KEY\" ]; then npx convex deploy --cmd \"npm run build\"; else npm run build; fi'"
  publish = "dist"

# Vite 7 requires Node ^20.19.0 || >=22.12.0. Pin a compatible version
# so the build never silently breaks on an older default Node.
[build.environment]
  NODE_VERSION = "22"


# SPA fallback: /auth, /dashboard e qualquer rota client-side devem
# servir index.html em vez de retornar 404 ao dar refresh na página.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache longo para assets versionados (nomes com hash do Vite).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
