# Configuração de build para Netlify
# O app é uma SPA (Vite) — o backend/database vive na Convex Cloud,
# então o Netlify apenas serve os arquivos estáticos de dist/.

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: /auth, /dashboard e qualquer rota client-side devem
# servir index.html em vez de retornar 404 ao dar refresh na página.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache longo para assets versionados (nomes com hash do Vite).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
